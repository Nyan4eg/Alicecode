name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate tag and source
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match package.json version." }
          Get-ChildItem app -Recurse -File | Where-Object Extension -in '.mjs','.js','.cjs' | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed." }
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "Alicecode-Setup-$version-x64.exe"
          $files = @("dist/$installer", "dist/$installer.blockmap", 'dist/latest.yml')
          foreach ($analyzerFile in @('dist/win-unpacked/resources/typescript-lib/lib.es2022.full.d.ts', 'dist/win-unpacked/resources/typescript-lib/lib.dom.d.ts', 'dist/win-unpacked/resources/app.asar.unpacked/app/code-worker.mjs')) {
            if (-not (Test-Path -LiteralPath $analyzerFile -PathType Leaf)) { throw "Missing packaged analyzer resource: $analyzerFile" }
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" }
          }
          $hash = (Get-FileHash -LiteralPath "dist/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          gh release create $env:GITHUB_REF_NAME @files dist/SHA256SUMS.txt --verify-tag --draft --title "Alicecode $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
