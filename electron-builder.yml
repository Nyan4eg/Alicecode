appId: io.github.nyan4eg.alicecode
productName: Alicecode
artifactName: Alicecode-Setup-${version}-${arch}.${ext}
directories:
  output: dist
files:
  - app/**/*
  - package.json
asarUnpack:
  - app/code-worker.mjs
  - app/workspace.mjs
  - app/activity.mjs
  - node_modules/typescript/**
extraResources:
  - from: node_modules/typescript/lib
    to: typescript-lib
    filter:
      - '*.d.ts'
  - from: LICENSE
    to: LICENSE.txt
win:
  icon: assets/alicecode.ico
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Alicecode
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Nyan4eg
  repo: Alicecode
  private: false
  releaseType: release
